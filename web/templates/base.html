<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Fraud Detection Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-slate-800 text-white px-6 py-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span class="text-lg font-bold text-amber-400 tracking-tight">
                Insurance Fraud Detection Engine
            </span>
            <div class="flex gap-8 text-sm font-medium">
                <a href="/"
                   class="hover:text-amber-400 transition pb-1 {% if active == 'overview' %}border-b-2 border-amber-400 text-amber-400{% endif %}">
                    Overview
                </a>
                <a href="/evaluation"
                   class="hover:text-amber-400 transition pb-1 {% if active == 'evaluation' %}border-b-2 border-amber-400 text-amber-400{% endif %}">
                    Evaluation
                </a>
                <a href="/explainability"
                   class="hover:text-amber-400 transition pb-1 {% if active == 'explainability' %}border-b-2 border-amber-400 text-amber-400{% endif %}">
                    Explainability
                </a>
                <a href="/scorer"
                   class="hover:text-amber-400 transition pb-1 {% if active == 'scorer' %}border-b-2 border-amber-400 text-amber-400{% endif %}">
                    Risk Scorer
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
